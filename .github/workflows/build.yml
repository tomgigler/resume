name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build active site configuration
        run: python build.py

      - name: Build example configuration
        run: >-
          python build.py
          --resume resume.example.json
          --site site.example.json
          --output dist-example

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: resume-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
